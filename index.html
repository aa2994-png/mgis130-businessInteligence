<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Competitive intelligence dashboard for monitoring technology sector stock performance."
    />
    <meta property="og:title" content="Competitive Intelligence Dashboard" />
    <meta
      property="og:description"
      content="Track real-time stock performance across major technology companies."
    />
    <meta property="og:type" content="website" />
    <title>Competitive Intelligence Dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-color: #0e1117;
        --card-color: #161b26;
        --accent-color: #00c897;
        --danger-color: #ff4d6d;
        --text-color: #f1f5f9;
        --muted-text: #94a3b8;
        --table-border: rgba(255, 255, 255, 0.12);
        --shadow: 0 18px 45px rgba(15, 23, 42, 0.35);
        font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #1e293b, var(--bg-color));
        color: var(--text-color);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
      }

      main {
        max-width: 1100px;
        width: 100%;
        background: var(--card-color);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 2.5rem 2rem;
        border: 1px solid var(--table-border);
        position: relative;
        overflow: hidden;
      }

      main::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, rgba(0, 200, 151, 0.08), transparent);
        pointer-events: none;
      }

      header {
        margin-bottom: 2rem;
        text-align: center;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 2.8rem);
        margin: 0;
        letter-spacing: 0.04em;
      }

      p.subtitle {
        margin-top: 0.75rem;
        color: var(--muted-text);
        font-size: 1.05rem;
        letter-spacing: 0.03em;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-bottom: 1.5rem;
      }

      button {
        background: transparent;
        color: var(--text-color);
        border: 1px solid var(--accent-color);
        border-radius: 999px;
        padding: 0.65rem 1.6rem;
        font-size: 0.95rem;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover,
      button:focus-visible {
        background: var(--accent-color);
        color: #04151f;
        box-shadow: 0 10px 25px rgba(0, 200, 151, 0.45);
        transform: translateY(-1px);
        outline: none;
      }

      button:active {
        transform: translateY(0);
        box-shadow: none;
      }

      .status {
        text-align: center;
        font-size: 0.95rem;
        color: var(--muted-text);
        min-height: 1.5rem;
        margin-bottom: 1rem;
      }

      .table-wrapper {
        overflow-x: auto;
        border-radius: 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(12px);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px var(--table-border);
        opacity: 0;
        transform: translateY(15px);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }

      table.visible {
        opacity: 1;
        transform: translateY(0);
      }

      thead {
        background: rgba(148, 163, 184, 0.12);
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
      }

      th,
      td {
        padding: 1rem 1.2rem;
        text-align: left;
        border-bottom: 1px solid var(--table-border);
        white-space: nowrap;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      .price {
        font-variant-numeric: tabular-nums;
      }

      .price.high {
        color: var(--accent-color);
        font-weight: 600;
      }

      .price.low {
        color: var(--danger-color);
        font-weight: 600;
      }

      .change-indicator {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        font-size: 0.85rem;
        background: rgba(148, 163, 184, 0.12);
        color: var(--muted-text);
      }

      .timestamp {
        margin-top: 1.5rem;
        text-align: center;
        color: var(--muted-text);
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        main {
          padding: 2rem 1.25rem;
        }

        th,
        td {
          padding: 0.75rem 0.8rem;
        }

        .change-indicator {
          padding: 0.25rem 0.6rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Competitive Intelligence Dashboard</h1>
        <p class="subtitle">Technology Sector Stock Analysis</p>
      </header>
      <section class="controls" aria-label="Dashboard controls">
        <button id="refresh" type="button">Refresh Data</button>
        <button id="export" type="button">Export to CSV</button>
      </section>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div class="table-wrapper">
        <table id="stocks-table" aria-describedby="status">
          <thead>
            <tr>
              <th scope="col">Company</th>
              <th scope="col">Ticker</th>
              <th scope="col">Current Price</th>
              <th scope="col">Change Indicator</th>
            </tr>
          </thead>
          <tbody id="stocks-body"></tbody>
        </table>
      </div>
      <p id="timestamp" class="timestamp" aria-live="polite"></p>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const tableEl = document.getElementById("stocks-table");
      const tbodyEl = document.getElementById("stocks-body");
      const timestampEl = document.getElementById("timestamp");
      const refreshBtn = document.getElementById("refresh");
      const exportBtn = document.getElementById("export");

      let latestData = [];
      let latestUpdatedAt = null;

      async function fetchStockData() {
        statusEl.textContent = "Fetching latest data...";
        tableEl.classList.remove("visible");
        timestampEl.textContent = "";
        tbodyEl.innerHTML = "";
        refreshBtn.disabled = true;
        exportBtn.disabled = true;

        try {
          const response = await fetch("/api/stocks");

          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const payload = await response.json();
          latestData = payload.stocks ?? [];
          latestUpdatedAt = payload.updatedAt ?? null;

          if (!Array.isArray(latestData) || latestData.length === 0) {
            throw new Error("No stock data returned.");
          }

          renderTable(latestData);
          renderTimestamp(latestUpdatedAt);

          statusEl.textContent = "";
          tableEl.classList.add("visible");
          refreshBtn.disabled = false;
          exportBtn.disabled = false;
        } catch (error) {
          console.error("Dashboard fetch error:", error);
          statusEl.textContent = "Unable to load data. Please try again.";
          refreshBtn.disabled = false;
          exportBtn.disabled = true;
        }
      }

      function renderTable(data) {
        const prices = data.map((item) => item.currentPrice);
        const maxPrice = Math.max(...prices);
        const minPrice = Math.min(...prices);

        tbodyEl.innerHTML = "";

        data.forEach((item) => {
          const row = document.createElement("tr");

          const companyCell = document.createElement("td");
          companyCell.textContent = item.company;
          companyCell.scope = "row";
          row.appendChild(companyCell);

          const tickerCell = document.createElement("td");
          tickerCell.textContent = item.ticker;
          row.appendChild(tickerCell);

          const priceCell = document.createElement("td");
          priceCell.classList.add("price");
          priceCell.textContent = formatCurrency(item.currentPrice);
          if (item.currentPrice === maxPrice) {
            priceCell.classList.add("high");
          }
          if (item.currentPrice === minPrice) {
            priceCell.classList.add("low");
          }
          row.appendChild(priceCell);

          const changeCell = document.createElement("td");
          const indicator = document.createElement("span");
          indicator.className = "change-indicator";
          indicator.textContent = deriveChangeIndicator(item.currentPrice, minPrice, maxPrice);
          changeCell.appendChild(indicator);
          row.appendChild(changeCell);

          tbodyEl.appendChild(row);
        });
      }

      function renderTimestamp(updatedAt) {
        if (!updatedAt) {
          timestampEl.textContent = "";
          return;
        }

        const formatted = new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(new Date(updatedAt));

        timestampEl.textContent = `Data captured at ${formatted}`;
      }

      function deriveChangeIndicator(price, minPrice, maxPrice) {
        if (price === maxPrice) {
          return "Highest performer";
        }
        if (price === minPrice) {
          return "Lowest performer";
        }
        return "Stable performer";
      }

      function formatCurrency(value) {
        if (typeof value !== "number" || Number.isNaN(value)) {
          return "$0.00";
        }
        return new Intl.NumberFormat(undefined, {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(value);
      }

      function exportToCsv() {
        if (!latestData.length) {
          return;
        }

        const headers = ["Company", "Ticker", "Current Price", "Timestamp"];
        const rows = latestData.map((item) => [
          item.company,
          item.ticker,
          formatCurrency(item.currentPrice),
          item.timestamp,
        ]);

        const csvContent = [headers, ...rows]
          .map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(","))
          .join("\n");

        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `competitive-intel-${Date.now()}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      refreshBtn.addEventListener("click", fetchStockData);
      exportBtn.addEventListener("click", exportToCsv);

      fetchStockData();
    </script>
  </body>
</html>
